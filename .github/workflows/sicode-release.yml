name: Si Code Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: vscode-linux-x64
            artifact: VSCode-linux-x64
            slug: linux-x64
            archive: SiCode-linux-x64.tar.gz
          - os: ubuntu-latest
            task: vscode-linux-arm64
            artifact: VSCode-linux-arm64
            slug: linux-arm64
            archive: SiCode-linux-arm64.tar.gz
          - os: windows-latest
            task: vscode-win32-x64
            artifact: VSCode-win32-x64
            slug: win32-x64
            archive: SiCode-win32-x64.zip
          - os: windows-latest
            task: vscode-win32-arm64
            artifact: VSCode-win32-arm64
            slug: win32-arm64
            archive: SiCode-win32-arm64.zip
          - os: macos-latest
            task: vscode-darwin-arm64
            artifact: VSCode-darwin-arm64
            slug: darwin-arm64
            archive: SiCode-darwin-arm64.tar.gz
          - os: macos-13
            task: vscode-darwin-x64
            artifact: VSCode-darwin-x64
            slug: darwin-x64
            archive: SiCode-darwin-x64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Linux packaging libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3 fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npm run gulp -- ${{ matrix.task }}

      - name: Archive Linux or macOS
        if: runner.os != 'Windows'
        run: tar -C .. -czf "../${{ matrix.archive }}" "${{ matrix.artifact }}"

      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "../${{ matrix.artifact }}" -DestinationPath "../${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ../${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Si Code ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
